[package]
name = "smart-accountant"
version = "1.0.0"
description = "GST-ready offline accounting for Indian businesses"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "smart_accountant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# 🚀 Added: Native SQLite Embedded Database Engine Features for Tauri v2
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers lets the app send an empty Origin header, which the plugin then removes.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-share-text = { path = "plugins/share-text" }
tauri-plugin-secure-key = { path = "plugins/secure-key" }
# QR scanner for pairing a phone (Android). Version 2 matches the Tauri 2 plugins above.
tauri-plugin-barcode-scanner = "2"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for per-company sync encryption keys.
keyring = { version = "3", features = ["windows-native"] }
# Native Windows clipboard access — used to place the invoice PDF on the
# clipboard as a real file reference (CF_HDROP) so WhatsApp pastes it as an
# attachment instead of a bitmap.
clipboard-win = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
