[package]
name = "smart-accountant"
version = "1.0.0"
description = "GST-ready offline accounting for Indian businesses"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "smart_accountant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# 🚀 Added: Native SQLite Embedded Database Engine Features for Tauri v2
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Native Windows clipboard access — used to place the invoice PDF on the
# clipboard as a real file reference (CF_HDROP) so WhatsApp pastes it as an
# attachment instead of a bitmap.
clipboard-win = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
