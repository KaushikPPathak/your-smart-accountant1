[package]
name = "tauri-plugin-secure-key"
version = "0.1.0"
description = "Keeps sync encryption keys in the Android Keystore"
edition = "2021"
links = "tauri-plugin-secure-key"
rust-version = "1.70"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
