[package]
name = "tauri-plugin-share-text"
version = "0.1.0"
description = "Shares text on Android through WhatsApp or the system share sheet"
edition = "2021"
links = "tauri-plugin-share-text"
rust-version = "1.70"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
