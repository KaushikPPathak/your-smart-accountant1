name: Build Legacy Windows Installers (Win 7 32/64-bit)

on:
  push:
    tags:
      - 'v*-legacy'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the installers'
        required: false
        default: 'false'

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Supabase build configuration
        shell: pwsh
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "VITE_SUPABASE_URL is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "VITE_SUPABASE_PUBLISHABLE_KEY is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PROJECT_ID)) {
            throw "VITE_SUPABASE_PROJECT_ID is missing"
          }

          Write-Host "Supabase build configuration is present."
          Write-Host "Supabase URL: $env:VITE_SUPABASE_URL"
          Write-Host "Project ID: $env:VITE_SUPABASE_PROJECT_ID"

      - name: Build web app (relative base for file://)
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

        run: npm run build:legacy

      - name: Transpile CSS for Chromium 108 compatibility
        shell: pwsh
        run: |
          $cssFiles = Get-ChildItem -Path "dist/assets/*.css" -ErrorAction SilentlyContinue

          if (-not $cssFiles) {
            Write-Host "No CSS files found. Skipping CSS transpilation."
          }
          else {
            foreach ($cssFile in $cssFiles) {
              Write-Host "Transpiling CSS: $($cssFile.FullName)"
              npx lightningcss-cli --targets "chrome 108" "$($cssFile.FullName)" -o "$($cssFile.FullName)"

              if ($LASTEXITCODE -ne 0) {
                throw "CSS transpilation failed for $($cssFile.FullName)"
              }
            }
          }

      - name: Stage web build into electron-legacy/app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron-legacy/app | Out-Null

          Copy-Item -Recurse -Force dist/* electron-legacy/app/

          Write-Host "Web build staged into electron-legacy/app"

      - name: Install electron-legacy dependencies
        working-directory: electron-legacy
        run: npm install --legacy-peer-deps

      - name: Build ${{ matrix.arch }} installer
        working-directory: electron-legacy
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAccountant-${{ matrix.arch }}
          path: electron-legacy/out/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
