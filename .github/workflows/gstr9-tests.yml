name: GSTR-9 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gstr9
    paths:
      - "src/lib/gstr9.ts"
      - "src/lib/gstr9.test.ts"
      - "src/lib/gstr9-export.ts"
      - "src/lib/gstr9-gstn-export.ts"
      - "src/lib/gstr9-inputs.ts"
      - "src/lib/gstr9-inputs.test.ts"
      - "src/lib/gstr9-input-store.ts"
      - "src/lib/gstr9-input-store.test.ts"

      # GSTR-1 Excel import
      - "src/lib/gstr1-excel-import.ts"
      - "src/lib/gstr1-excel-import.test.ts"

      - "src/lib/offline/db.ts"
      - "src/lib/gst-returns.ts"
      - "src/lib/gst-returns.test.ts"
      - "src/routes/app.reports.gstr9.tsx"
      - "src/components/AppSidebar.tsx"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/gstr9-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run GSTR-9 tests
        run: >
          bunx vitest run
          src/lib/gstr9.test.ts
          src/lib/gstr9-inputs.test.ts
          src/lib/gstr9-input-store.test.ts

      - name: Run GSTR-1 Excel import tests
        run: bunx vitest run src/lib/gstr1-excel-import.test.ts

      - name: Run all tests
        run: bunx vitest run

      - name: Run Vite build and route generation
        run: bun vite build

      - name: Inspect generated route tree
        shell: bash
        run: |
          echo "===== GSTR-9 references in generated route tree ====="
          grep -n -i "gstr9" src/routeTree.gen.ts || true

          echo ""
          echo "===== Git status after Vite build ====="
          git status --short

          echo ""
          echo "===== Changes made to routeTree.gen.ts by Vite ====="
          git diff -- src/routeTree.gen.ts || true

      - name: TypeScript type check
        run: bunx tsc --noEmit
