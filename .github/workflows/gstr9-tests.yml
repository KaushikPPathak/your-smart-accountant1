name: GSTR-9 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gstr9
    paths:
      - "src/lib/gstr9.ts"
      - "src/lib/gstr9.test.ts"
      - "src/lib/gst-returns.ts"
      - "src/lib/gst-returns.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/gstr9-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run GSTR-9 tests
        run: bunx vitest run src/lib/gstr9.test.ts

      - name: Run all tests
        run: bunx vitest run
