name: Build Android APK

# Builds the Android APK from the same Tauri app as the Windows installer.
# Runs on demand, or when a version tag is pushed. Signing uses the secrets
# below when they exist; without them the APK is built unsigned (for testing).
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: "26.1.10909125"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK (on the runner's preinstalled SDK)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project
        run: bunx tauri android init --ci

      - name: Configure signing (only when the secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=${ANDROID_KEYSTORE_PASSWORD}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storeFile=release.jks
          PROPS

      - name: Enable release signing in Gradle (only when the secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          lines = p.read_text().split("\n")
          if any("signingConfigs" in l for l in lines):
              print("signingConfigs already present")
              sys.exit(0)
          idx = next((i for i, l in enumerate(lines) if re.match(r"\s*buildTypes\s*\{", l)), None)
          if idx is None:
              sys.exit("buildTypes block not found")
          block = [
              "    signingConfigs {",
              "        create(\"release\") {",
              "            val props = Properties()",
              "            val f = rootProject.file(\"keystore.properties\")",
              "            if (f.exists()) {",
              "                props.load(f.inputStream())",
              "                storeFile = rootProject.file(props.getProperty(\"storeFile\"))",
              "                storePassword = props.getProperty(\"storePassword\")",
              "                keyAlias = props.getProperty(\"keyAlias\")",
              "                keyPassword = props.getProperty(\"keyPassword\")",
              "            }",
              "        }",
              "    }",
          ]
          lines[idx:idx] = block
          lines.insert(0, "import java.util.Properties")
          rel = next((i for i in range(idx + len(block), len(lines)) if re.search(r"release\s*\{|getByName\(\"release\"\)\s*\{", lines[i])), None)
          if rel is None:
              sys.exit("release build type not found")
          lines.insert(rel + 1, "            signingConfig = signingConfigs.getByName(\"release\")")
          p.write_text("\n".join(lines))
          print("release signing enabled")
          PY
          grep -n -B2 -A3 'signingConfig' src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK (arm64 phones)
        env:
          VITE_GSTIN_PROXY_URL: ${{ vars.VITE_GSTIN_PROXY_URL }}
        run: bunx tauri android build --apk --target aarch64

      - name: Inspect APK (minimum Android, CPU types, signature)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|launchable" || true
          grep -n -A12 "signingConfigs" src-tauri/gen/android/app/build.gradle.kts || echo "no signingConfigs block in build.gradle.kts"
          if "$BT/apksigner" verify --print-certs "$APK"; then
            echo "SIGNATURE OK"
          else
            echo "NOT SIGNED OR SIGNATURE INVALID"
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then exit 1; fi
          fi

      - name: Read app version
        id: ver
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAccountant-Android-${{ steps.ver.outputs.version }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
